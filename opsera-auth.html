<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize Opsera DevSecOps Agents</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #08070b;
            --panel-bg: rgba(255, 255, 255, 0.02);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-purple: #a855f7;
            --accent-purple-glow: rgba(168, 85, 247, 0.2);
            --text-main: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            font-family: 'Outfit', 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .auth-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 30px var(--accent-purple-glow);
            backdrop-filter: blur(20px);
            animation: cardFade 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes cardFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.25rem;
        }

        .logo-circle {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 12px var(--accent-purple);
        }

        .logo-circle svg {
            width: 20px;
            height: 20px;
            color: #fff;
        }

        h2 {
            font-size: 1.3rem;
            font-weight: 800;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin: 0 0 1.5rem 0;
            line-height: 1.5;
        }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            background: #fff;
            color: #1f2937;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(255,255,255,0.05);
        }

        .btn-google:hover {
            background: #f3f4f6;
            transform: translateY(-1px);
        }

        .loader-wrap {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            margin-top: 0.5rem;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(168, 85, 247, 0.2);
            border-top: 3px solid var(--accent-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .success-text {
            color: #10b981;
            font-weight: 700;
            font-size: 0.85rem;
            margin: 0.25rem 0;
        }

        .dcr-console {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 1.25rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.65rem;
            text-align: left;
            overflow-y: auto;
            max-height: 120px;
            color: #10B981;
        }

        .dcr-line {
            margin: 0.2rem 0;
            opacity: 0.8;
            animation: lineFade 0.3s forwards;
        }

        @keyframes lineFade {
            from { opacity: 0; transform: translateX(-5px); }
            to { opacity: 0.8; transform: translateX(0); }
        }

        .dcr-line.info { color: #a855f7; }
        .dcr-line.success { color: #10B981; font-weight: bold; }
        .dcr-line.warn { color: #f59e0b; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo-wrap">
            <div class="logo-circle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <span style="font-size: 1.15rem; font-weight: 800; letter-spacing: 0.05em; color: #fff;">OPSERA</span>
        </div>
        <h2 id="title-text">Connect to Opsera</h2>
        <p class="subtitle" id="desc-text">Authorize <strong>SuperPlane Autopilot</strong> to access your DevSecOps agents and execute real-time security telemetry.</p>
        
        <div class="dcr-console" id="dcr-console" style="display: none;">
            <div class="dcr-line info">> Initiating connection flow...</div>
        </div>

        <button class="btn-google" id="btn-auth">
            <svg style="width:16px; height:16px;" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22c-.08-.2-.14-.41-.18-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span id="btn-text">Sign In with Google</span>
        </button>

        <div class="loader-wrap" id="loader">
            <div class="spinner"></div>
            <span class="status-text" id="status-text">Authenticating browser session...</span>
        </div>
    </div>

    <script>
        const btnAuth = document.getElementById("btn-auth");
        const btnText = document.getElementById("btn-text");
        const loader = document.getElementById("loader");
        const titleText = document.getElementById("title-text");
        const descText = document.getElementById("desc-text");
        const dcrConsole = document.getElementById("dcr-console");

        // Parse query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const flow = urlParams.get("flow") || "oauth-dcr";

        if (flow === "oauth-dcr" || flow === "dcr") {
            titleText.innerText = "OAuth 2.0 DCR Sign-In";
            descText.innerHTML = "Securely authorize <strong>SuperPlane Autopilot</strong>. Opsera supports <strong>OAuth Dynamic Client Registration (DCR)</strong> for zero-setup token bootstrapping.";
            dcrConsole.style.display = "block";
            logToConsole("Detected server support for OAuth DCR.", "info");
            logToConsole("Ready to register dynamic client metadata...", "info");
            btnText.innerText = "Register & Sign In with Google";
        } else {
            titleText.innerText = "Manual OAuth Sign-In";
            descText.innerHTML = "Authorize <strong>SuperPlane Autopilot</strong> to access your DevSecOps agents using standard manual client configurations.";
        }

        function logToConsole(text, type = "normal") {
            const line = document.createElement("div");
            line.className = `dcr-line ${type}`;
            line.innerText = `> ${text}`;
            dcrConsole.appendChild(line);
            dcrConsole.scrollTop = dcrConsole.scrollHeight;
        }

        btnAuth.addEventListener("click", () => {
            btnAuth.style.display = "none";
            
            if (flow === "oauth-dcr" || flow === "dcr") {
                logToConsole("POST /register dynamic client payload...", "normal");
                
                setTimeout(() => {
                    logToConsole("DCR response code 201 Created", "success");
                    logToConsole("Generated client_id: client_opsera_dcr_91a0b", "success");
                    
                    setTimeout(() => {
                        logToConsole("Redirecting to social Identity Provider...", "info");
                        loader.style.display = "flex";
                        startOauthFlow();
                    }, 1000);
                }, 1200);
            } else {
                loader.style.display = "flex";
                startOauthFlow();
            }
        });

        function startOauthFlow() {
            document.getElementById("status-text").innerText = "Authenticating browser session...";
            
            setTimeout(() => {
                document.getElementById("status-text").innerText = "Granting OAuth permission...";
                
                setTimeout(() => {
                    // Send message back to parent opener window
                    if (window.opener) {
                        window.opener.postMessage({
                            type: "OPSERA_AUTH_SUCCESS",
                            token: "opsera_jwt_session_token_cloud_491",
                            authMethod: flow === "oauth-dcr" || flow === "dcr" ? "oauth-dcr" : "manual-token"
                        }, "*");
                    }
                    
                    document.getElementById("status-text").className = "success-text";
                    document.getElementById("status-text").innerText = "✓ Connected Successfully!";
                    
                    setTimeout(() => {
                        window.close();
                    }, 1000);
                }, 1500);
            }, 1200);
        }
    </script>
</body>
</html>
